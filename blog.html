<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blog | Code Study Notes</title>
<style>
  :root {
    --main: #7fffd4;
    --main-soft: #d9fff2;
    --main-deep: #2fbf94;
    --ink: #0f3d33;
    --bg: #f4fffb;
    --card: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.8;
  }
  a { color: inherit; text-decoration: none; }

  /* header */
  header {
    background: var(--main);
    border-bottom: 3px solid var(--ink);
    position: sticky; top: 0; z-index: 10;
  }
  .nav {
    max-width: 960px; margin: 0 auto; padding: 12px 20px;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px;
  }
  .logo { font-family: "Courier New", monospace; font-weight: bold; font-size: 1.15rem; }
  .logo span { background: var(--ink); color: var(--main); padding: 0 6px; border-radius: 4px; }
  nav ul { list-style: none; display: flex; gap: 6px; flex-wrap: wrap; }
  nav a {
    display: block; padding: 4px 14px; border-radius: 999px;
    font-family: "Courier New", monospace; font-size: .9rem; font-weight: bold;
  }
  nav a:hover, nav a.current { background: var(--ink); color: var(--main); }

  /* page title */
  .page-title { max-width: 640px; margin: 0 auto; padding: 40px 20px 8px; }
  .page-title h1 { font-family: "Courier New", monospace; font-size: 1.8rem; }
  .page-title h1::before { content: "//"; color: var(--main-deep); margin-right: 10px; }
  .page-title p { font-size: .95rem; }

  /* timeline */
  main { max-width: 640px; margin: 0 auto; padding: 16px 20px 56px; }
  .timeline { border: 2px solid var(--ink); border-radius: 14px; background: var(--card); overflow: hidden; box-shadow: 4px 4px 0 var(--main); }
  .post { padding: 16px 20px; border-bottom: 1px solid var(--main-soft); display: flex; gap: 14px; }
  .post:last-child { border-bottom: none; }
  .post:hover { background: var(--bg); }
  .avatar {
    flex: none; width: 42px; height: 42px; border-radius: 50%;
    background: var(--main); border: 2px solid var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-family: "Courier New", monospace; font-weight: bold; font-size: .85rem;
  }
  .post-body { flex: 1; min-width: 0; }
  .post time { font-family: "Courier New", monospace; font-size: .8rem; color: var(--main-deep); font-weight: bold; }
  .post p { font-size: .96rem; overflow-wrap: anywhere; }

  .back { display: inline-block; margin-top: 24px; font-family: "Courier New", monospace; font-weight: bold; border-bottom: 3px solid var(--main); }

  footer { background: var(--main); border-top: 3px solid var(--ink); text-align: center; padding: 20px; font-family: "Courier New", monospace; font-size: .85rem; }
</style>
</head>
<body>

<header>
  <div class="nav">
    <a class="logo" href="index.html"><span>&gt;_</span> Code Study Notes</a>
    <nav>
      <ul>
        <li><a href="index.html">index</a></li>
        <li><a class="current" href="blog.html">blog</a></li>
        <li><a href="column.html">column</a></li>
        <li><a href="about.html">about</a></li>
      </ul>
    </nav>
  </div>
</header>

<div class="page-title">
  <h1>blog</h1>
  <p>勉強の進捗ログ。新しい順に並べています。</p>
</div>

<main>
  <div class="timeline">

    <!-- ▼ 新しい投稿は、この下に <article> ごと追加してください（上が最新） -->
    <article class="post">
      <div class="avatar">&gt;_</div>
      <div class="post-body">
        <time>2026.10.09</time>
        <p>サイトをつくり始めた日。まずはトップページから。</p>
      </div>
    </article>

    <article class="post">
      <div class="avatar">&gt;_</div>
      <div class="post-body">
        <time>2026.10.08</time>
        <p>（ここに勉強の日記が入ります。やったこと、つまずいたこと、わかったことを一言ずつ。）</p>
      </div>
    </article>

    <article class="post">
      <div class="avatar">&gt;_</div>
      <div class="post-body">
        <time>2026.10.07</time>
        <p>（サンプル）HTMLとCSSの復習。flexboxがちょっと分かってきた気がする。</p>
      </div>
    </article>

    <!-- ▲ ここまで -->

  </div>

  <a class="back" href="index.html">&lt; index に戻る</a>
</main>

<footer>
  &copy; 2026 Code Study Notes
</footer>

</body>
</html>
