<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>勉強ブログ | アプリの勉強ノート</title>
<meta name="description" content="アプリの勉強の進捗を、日付とひとことで記録するブログです。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;800&display=swap" rel="stylesheet">
<style>
:root {
  --red: #ff0000;
  --red-deep: #c20000;
  --ink: #2a0a0a;
  --paper: #fff8f6;
  --blush: #ffe3e0;
  --white: #ffffff;
  --font: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: var(--font);
  color: var(--ink);
  background: var(--paper);
  line-height: 1.85;
  font-size: 16px;
}
a { color: inherit; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

/* ---------- header ---------- */
.site-header { background: var(--red); color: var(--white); }
.site-header .inner {
  max-width: 1040px;
  margin: 0 auto;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}
.logo { font-weight: 800; font-size: 1.15rem; text-decoration: none; letter-spacing: .02em; }
nav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 6px; flex-wrap: wrap; }
nav a {
  display: block;
  padding: 6px 16px;
  border-radius: 999px;
  text-decoration: none;
  font-weight: 500;
  font-size: .95rem;
}
nav a:hover { background: rgba(255,255,255,.2); }
nav a[aria-current="page"] { background: var(--white); color: var(--red-deep); font-weight: 800; }

/* ---------- page title ---------- */
.page-title { background: var(--red); color: var(--white); padding: 28px 20px 44px; }
.page-title .inner { max-width: 1040px; margin: 0 auto; }
.page-title h1 { margin: 0 0 6px; font-size: clamp(1.9rem, 5vw, 2.8rem); font-weight: 800; line-height: 1.3; }
.page-title p { margin: 0; font-weight: 500; }

/* ---------- feed ---------- */
main { max-width: 680px; margin: 0 auto; padding: 36px 20px 0; }
.feed { display: grid; gap: 16px; }
.post {
  background: var(--white);
  border: 3px solid var(--ink);
  border-radius: 20px;
  padding: 16px 22px 18px;
}
.post time {
  display: block;
  font-size: .82rem;
  font-weight: 800;
  color: var(--red-deep);
}
.post p { margin: 4px 0 0; overflow-wrap: anywhere; }

.note { text-align: center; margin: 36px 0 0; font-size: .9rem; color: var(--red-deep); font-weight: 800; }

footer {
  margin-top: 80px;
  background: var(--red);
  color: var(--white);
  text-align: center;
  padding: 26px 20px;
  font-size: .9rem;
  font-weight: 500;
}
</style>
</head>
<body>

<header class="site-header">
  <div class="inner">
    <a class="logo" href="index.html">アプリの勉強ノート</a>
    <nav aria-label="メインメニュー">

        <li><a href="about.html">このサイトについて</a></li>

    </nav>

<div class="page-title">

    <h1>勉強ブログ</h1>
    <p>日付とひとことだけの、勉強の進捗メモです。新しい順に並べています。</p>
  </div>
</div>

<main>

  </div>

<footer>
  <p style="margin:0">© アプリの勉強ノート</p>
</footer>

</body>
</html>
